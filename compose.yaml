name: nostalgiar-local

x-backend: &backend
  image: nostalgiar-backend:local
  build:
    context: .
  environment: &backend-environment
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: 8080
    ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=nostalgiar;Username=nostalgiar;Password=${DOCKER_POSTGRES_PASSWORD:-nostalgiar-local-db}
    Neo4j__Uri: bolt://neo4j:7687
    Neo4j__User: neo4j
    Neo4j__Password: ${DOCKER_NEO4J_PASSWORD:-nostalgiar-local-graph}
    Jwt__Clave: ${DOCKER_JWT_KEY:-nostalgiar-local-demo-key-change-before-deploy-2026}
    Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-3001}
    Cors__AllowedOrigins__1: http://127.0.0.1:${FRONTEND_PORT:-3001}
    Seed__Habilitado: "false"
    Redis__Habilitado: "true"
    Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000
    AnalisisRecuerdos__Habilitado: "false"
    Gemini__Habilitado: "false"
    Cloudinary__CloudName: ${DOCKER_CLOUDINARY_CLOUD_NAME:-}
    Cloudinary__ApiKey: ${DOCKER_CLOUDINARY_API_KEY:-}
    Cloudinary__ApiSecret: ${DOCKER_CLOUDINARY_API_SECRET:-}

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: nostalgiar
      POSTGRES_USER: nostalgiar
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-nostalgiar-local-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostalgiar -d nostalgiar"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${DOCKER_NEO4J_PASSWORD:-nostalgiar-local-graph}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  initialize:
    <<: *backend
    command: ["--initialize-docker"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5199}:8080"
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/swagger/v1/swagger.json"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    image: nostalgiar-frontend:local
    build:
      context: ${FRONTEND_CONTEXT:-../Web/ProyectoFinalTPI}
      dockerfile: ../../ProyectoFinalTPI.Backend/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5199}
        NEXT_PUBLIC_MAP_MODE: ${DOCKER_MAP_MODE:-2d}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${DOCKER_MAPBOX_ACCESS_TOKEN:-}
        NEXT_PUBLIC_REQUIRE_PUBLICATION_MEDIA: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  redis-data:
  postgres-data:
  neo4j-data:
